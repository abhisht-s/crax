[build-system]
requires = ["setuptools>=68"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "agent-gpt-codex-loop"
version = "0.1.0"
description = "Local supervised agent loop prototype."
requires-python = ">=3.11"

[project.scripts]
agent-loop = "agent.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]
exclude = ["data*"]
